name: data_record_app
description: "A cross-platform offline-first time and event data recording app with ECharts visualization."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.0.5
  intl: ^0.18.1
  uuid: ^3.0.7
  path_provider: ^2.0.15
  flutter_echarts: ^2.4.0
  webview_flutter: ^4.2.0
  share_plus: ^7.0.2
  file_picker: ^5.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0

flutter:
  uses-material-design: true
